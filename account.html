<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ЦВЗ — Личный кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #f11c23;
      --navy: #072139;
      --bg: linear-gradient(165deg, #072139, #0b2f4d 48%, #051828);
      --bg-spot: rgba(241, 28, 35, 0.16);
      --text: #fff;
      --muted: #9db0c2;
      --line: rgba(255,255,255,.14);
      --surface: rgba(255,255,255,.06);
      --surface-2: rgba(255,255,255,.1);
      --input-bg: rgba(5,24,40,.9);
      --heading: #ffb4b7;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --font: "Manrope", system-ui, sans-serif;
      --display: "Unbounded", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: var(--font); color: var(--text);
      background: radial-gradient(900px 480px at 8% -8%, var(--bg-spot), transparent 55%), var(--bg);
    }
    .wrap { width: min(560px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 64px; }
    .wrap.wide { width: min(920px, calc(100% - 28px)); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .brand {
      font-family: var(--display); font-weight: 500; font-size: 1.05rem; letter-spacing: .02em;
    }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    h1 { font-family: var(--display); font-weight: 500; font-size: 1.45rem; margin: 0 0 6px; }
    h2 { font-size: 1.02rem; margin: 0 0 12px; font-weight: 700; }
    .muted { color: var(--muted); font-size: .92rem; line-height: 1.45; }
    .note {
      margin: 0 0 14px; font-size: .78rem; color: var(--muted); opacity: .85;
    }
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px; margin-top: 14px; box-shadow: var(--shadow);
    }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    label.lbl {
      font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600;
    }
    input, select, button, textarea { font: inherit; color: var(--text); }
    input, select, textarea {
      width: 100%; background: var(--input-bg); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: rgba(241,28,35,.55); box-shadow: 0 0 0 3px rgba(241,28,35,.18);
    }
    textarea { resize: vertical; min-height: 110px; }
    .btn {
      border: none; border-radius: 12px; padding: 11px 14px; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-sm { padding: 8px 12px; font-size: .88rem; border-radius: 10px; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
    .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-block { width: 100%; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .hidden { display: none !important; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
    .tab {
      border: 1px solid var(--line); background: transparent; color: var(--text);
      border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: .88rem;
    }
    .tab.active { background: var(--red); border-color: var(--red); color: #fff; }
    .consent {
      display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
      margin: 0 0 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
      background: rgba(0,0,0,.12);
    }
    .consent input[type="checkbox"] {
      width: 22px; height: 22px; margin-top: 2px; accent-color: var(--red); cursor: pointer;
    }
    .consent span { font-size: .92rem; line-height: 1.4; }
    .consent a { color: var(--heading); }
    .ok {
      background: rgba(46,160,90,.15); border: 1px solid rgba(46,160,90,.35);
      color: #b7f0c8; padding: 10px 12px; border-radius: 10px; font-size: .88rem; margin-top: 10px;
    }
    .warn {
      background: rgba(241,28,35,.12); border: 1px solid rgba(241,28,35,.35);
      color: #ffb4b7; padding: 10px 12px; border-radius: 10px; font-size: .88rem; margin-top: 10px;
    }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--line); padding: 10px 14px;
      border-radius: 999px; opacity: 0; transition: .25s; z-index: 40; max-width: 90vw;
    }
    .toast.show { opacity: 1; }
    .deal, .card-mini {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 8px; background: rgba(0,0,0,.1);
    }
    .pack-wrap { position: relative; }
    .icon-copy {
      position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--input-bg); color: var(--text); cursor: pointer;
      display: grid; place-items: center;
    }
    #chatPack { min-height: 140px; padding-right: 52px; font-family: ui-monospace, monospace; font-size: .8rem; }
    .grid-compact { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .grid-compact .field { margin-bottom: 0; }
    .grid-compact input, .grid-compact textarea { padding: 8px 10px; font-size: .9rem; }
    .grid-compact textarea { min-height: 52px; }
    details.more {
      margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    }
    details.more > summary {
      cursor: pointer; font-weight: 700; list-style: none; color: var(--heading);
    }
    details.more > summary::-webkit-details-marker { display: none; }
    .site-footer {
      margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line);
      display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: .82rem;
    }
    .site-footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
    .site-footer a:hover { color: var(--heading); }
    .dropzone {
      border: 1px dashed var(--line); border-radius: 12px; padding: 16px;
      background: rgba(0,0,0,.12); text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .dropzone:hover, .dropzone.drag {
      border-color: rgba(241,28,35,.55); background: rgba(241,28,35,.08);
    }
    .dropzone .hint { color: var(--muted); font-size: .88rem; margin: 0; }
    .img-preview {
      margin-top: 10px; display: none; position: relative;
      border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
      background: rgba(0,0,0,.2);
    }
    .img-preview.show { display: block; }
    .img-preview img { display: block; max-width: 100%; max-height: 280px; margin: 0 auto; }
    .img-preview .btn-clear-img {
      position: absolute; top: 8px; right: 8px;
    }
    #updNotes {
      min-height: 120px; background: rgba(0,0,0,.18);
    }
    #updNotes.has-issues {
      border-color: rgba(241,28,35,.55);
      box-shadow: 0 0 0 3px rgba(241,28,35,.12);
    }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="topbar">
      <div class="brand">ЦВЗ · кабинет</div>
      <div class="top-actions">
        <a class="btn btn-ghost btn-sm" href="index.html">К поиску</a>
        <a class="btn btn-ghost btn-sm" href="info.html">Информация</a>
      </div>
    </div>

    <h1>Личный кабинет</h1>
    <p class="muted">Вход по телефону и паролю.</p>
    <p class="note">[заметки: профиль пишется в контакт Bitrix; админ-инструменты — по служебному паролю]</p>

    <div class="panel" id="authPanel">
      <div class="tabs" style="margin-bottom:14px">
        <button type="button" class="tab active" id="modeLogin">Вход</button>
        <button type="button" class="tab" id="modeReg">Регистрация</button>
      </div>

      <div class="field hidden" id="fioField">
        <label class="lbl" for="fio">ФИО</label>
        <input id="fio" type="text" placeholder="Иванов Иван Иванович" autocomplete="name" />
      </div>
      <div class="field">
        <label class="lbl" for="phone">Телефон</label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 (999) 999-99-99" maxlength="18" />
      </div>
      <div class="field">
        <label class="lbl" for="password">Пароль</label>
        <input id="password" type="password" placeholder="Не менее 4 символов" autocomplete="current-password" />
      </div>
      <div class="field hidden" id="adminPassField">
        <label class="lbl" for="adminPass">Служебный пароль админа</label>
        <input id="adminPass" type="password" placeholder="Только для сотрудников ЦВЗ" />
      </div>

      <div id="consentBlock" class="hidden">
        <label class="consent">
          <input type="checkbox" id="pdn" />
          <span>Даю согласие на обработку моих персональных данных в соответствии с <a href="privacy.html" target="_blank" rel="noopener">Политикой обработки персональных данных</a></span>
        </label>
        <label class="consent">
          <input type="checkbox" id="terms" />
          <span>Я подтверждаю, что ознакомился с условиями <a href="terms.html" target="_blank" rel="noopener">Пользовательского соглашения</a>, принимаю их в полном объёме и обязуюсь соблюдать</span>
        </label>
      </div>

      <button type="button" class="btn btn-primary btn-block" id="authBtn">Войти</button>
    </div>

    <div class="panel hidden" id="cabinet">
      <p id="cabHello" class="muted" style="margin:0 0 12px"></p>
      <div class="tabs" id="cabTabs"></div>
      <div id="tabCandidate" class="hidden"></div>
      <div id="tabFreelancer" class="hidden"></div>
      <div id="tabAdmin" class="hidden"></div>
      <button type="button" class="btn btn-ghost" id="logoutBtn" style="margin-top:14px">Выйти</button>
    </div>

    <footer class="site-footer">
      <a href="privacy.html" target="_blank" rel="noopener">Политика обработки персональных данных</a>
      <a href="terms.html" target="_blank" rel="noopener">Пользовательское соглашение</a>
      <a href="info.html">Информация</a>
    </footer>
  </div>
  <div class="toast" id="toast"></div>

  <script src="bitrix-config.js"></script>
  <script src="bitrix-api.js?v=phone2"></script>
  <script src="need-update.js?v=1"></script>
  <script src="sheets-write.js?v=1"></script>
  <script>
    const KEY = "cvz_lk_v1";
    const PARTNERS_KEY = "cvz_partners_v1";
    const TIMESHEET_KEY = "cvz_timesheet_v1";
    const SURVEY_KEY = "cvz_survey_v1";
    let authMode = "login";
    const FIELDS = [
      "Заказчик","гр-во","от","до","Регион","Питание","Питание*","Тип","ОТ","СБ","СБ*",
      "СП","М","Ж","Должность","Ставка макс","Ставка*","Объект","Оформление","График вахты",
      "Обязанности","Спец одежда","Мед книжка","Проживание","Заселение","Доставка","Компенсации",
      "для МАКС","доп инфа","МП","фикс/сделка","Адрес проживания","Адрес объекта","РУБ"
    ];
    const ALIAS = {
      "заказчик":"Заказчик","гр-во":"гр-во","гражданство":"гр-во","от":"от","до":"до",
      "регион":"Регион","питание":"Питание","питание*":"Питание*","тип":"Тип","от смен":"ОТ",
      "мин смен":"ОТ","сб":"СБ","сб*":"СБ*","сп":"СП","м":"М","ж":"Ж","должность":"Должность",
      "ставка":"Ставка макс","ставка макс":"Ставка макс","ставка*":"Ставка*","объект":"Объект",
      "оформление":"Оформление","график":"График вахты","график вахты":"График вахты",
      "обязанности":"Обязанности","спец одежда":"Спец одежда","со":"Спец одежда",
      "мед книжка":"Мед книжка","лмк":"Мед книжка","проживание":"Проживание","заселение":"Заселение",
      "доставка":"Доставка","компенсации":"Компенсации","доп инфа":"доп инфа","для макс":"для МАКС",
      "адрес проживания":"Адрес проживания","адрес объекта":"Адрес объекта","мп":"МП",
      "фикс/сделка":"фикс/сделка","руб":"РУБ"
    };
    const EAEU = ["Россия","Беларусь","Армения","Казахстан","Киргизия","Таджикистан","Узбекистан","Молдова","Азербайджан"].join("\n");
    const toast = document.getElementById("toast");
    function show(t) { toast.textContent = t; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 2200); }
    function load() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } }
    function saveSession(u) {
      localStorage.setItem(KEY, JSON.stringify({
        contactId: u.contactId, fio: u.fio, phone: u.phone, role: u.role,
        flOk: !!u.flOk, level: u.level || 0, localAdmin: !!u.localAdmin, at: Date.now()
      }));
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function isAdminUser(u) { return !!(u && (u.role === "admin" || u.localAdmin)); }

    const phoneEl = document.getElementById("phone");
    phoneEl.addEventListener("keydown", (e) => {
      const ok = ["Backspace","Delete","Tab","Escape","Enter","ArrowLeft","ArrowRight","Home","End"];
      if (ok.includes(e.key) || e.ctrlKey || e.metaKey) return;
      if (!/^\d$/.test(e.key)) e.preventDefault();
      if (/^\d$/.test(e.key) && CVZ_BX.isValidPhone(phoneEl.value) && phoneEl.selectionStart === phoneEl.selectionEnd) {
        e.preventDefault();
      }
    });
    phoneEl.addEventListener("paste", (e) => {
      e.preventDefault();
      phoneEl.value = CVZ_BX.formatPhone((e.clipboardData || window.clipboardData).getData("text"));
    });
    phoneEl.addEventListener("input", () => {
      phoneEl.value = CVZ_BX.formatPhone(phoneEl.value);
    });

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById("modeLogin").classList.toggle("active", mode === "login");
      document.getElementById("modeReg").classList.toggle("active", mode === "reg");
      document.getElementById("fioField").classList.toggle("hidden", mode === "login");
      document.getElementById("consentBlock").classList.toggle("hidden", mode === "login");
      document.getElementById("authBtn").textContent = mode === "login" ? "Войти" : "Зарегистрироваться";
      document.getElementById("password").autocomplete = mode === "login" ? "current-password" : "new-password";
    }
    document.getElementById("modeLogin").onclick = () => setAuthMode("login");
    document.getElementById("modeReg").onclick = () => setAuthMode("reg");
    setAuthMode("login");
    if (new URLSearchParams(location.search).get("admin") === "1") {
      document.getElementById("adminPassField").classList.remove("hidden");
    }

    function expandCitizen(raw) {
      const s = (raw || "").trim().toLowerCase().replace(/ё/g, "е");
      if (!s) return "";
      if (s === "рф" || s === "россия") return "Россия";
      if (/снг|еаэс|все/.test(s)) return EAEU;
      return raw.trim();
    }
    function parseBlob(text) {
      const draft = {};
      const lines = (text || "").replace(/\r/g, "").split("\n");
      let curKey = null, curVal = [];
      const flush = () => {
        if (!curKey) return;
        const col = ALIAS[curKey.toLowerCase()];
        if (col) draft[col] = curVal.join("\n").trim();
        curKey = null; curVal = [];
      };
      for (const line of lines) {
        const mm = line.match(/^([A-Za-zА-Яа-яЁё0-9* /\-]{1,40})\s*:\s*(.*)$/);
        if (mm && ALIAS[mm[1].trim().toLowerCase()]) {
          flush(); curKey = mm[1].trim(); curVal = [mm[2]];
        } else if (curKey) curVal.push(line);
      }
      flush();
      const loc = text.match(/📍\s*(.+)/);
      if (loc) {
        if (!draft["Объект"]) draft["Объект"] = loc[1].trim();
        if (!draft["для МАКС"]) draft["для МАКС"] = "📍" + loc[1].trim();
      }
      const dem = text.match(/(?:✅|потребн\w*|нужн\w*)\s*(\d+)\s*([мжМЖ])\b(?:\s*[+/и&\-]?\s*(\d+)\s*([мжМЖ]))?/i);
      if (dem) {
        draft[dem[2].toUpperCase()] = dem[1];
        if (dem[3]) draft[dem[4].toUpperCase()] = dem[3];
      }
      const job = text.match(/✅[^\n]*?\d+\s*[мжМЖ]\s+([^\n🔥]+)/i);
      if (job && !draft["Должность"]) draft["Должность"] = job[1].trim().replace(/[\/\s]+$/, "");
      const rate = text.match(/(?:🔥|ставк\w*[:\s]*)\s*(\d{3,5})/i);
      if (rate && !draft["Ставка макс"]) draft["Ставка макс"] = rate[1];
      if (draft["гр-во"]) draft["гр-во"] = expandCitizen(draft["гр-во"]);
      if (!draft["от"]) draft["от"] = "18";
      if (!draft["ОТ"]) draft["ОТ"] = "30";
      if (!draft["График вахты"]) draft["График вахты"] = "6/1, 7/0 от 30 смен";
      if (draft["М"] && draft["Ж"] && !draft["СП"]) draft["СП"] = "да";
      return draft;
    }

    function setTab(name) {
      ["tabCandidate", "tabFreelancer", "tabAdmin"].forEach((id) => {
        document.getElementById(id).classList.toggle("hidden", id !== "tab" + name);
      });
      document.querySelectorAll("#cabTabs .tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
      document.getElementById("wrap").classList.toggle("wide", name === "Admin");
    }

    function referralLink(contactId) {
      const u = new URL(location.href);
      u.pathname = u.pathname.replace(/account\.html$/i, "index.html");
      u.search = "?ref=" + encodeURIComponent(contactId);
      u.hash = "";
      return u.toString();
    }
    function partnerSearchBase() {
      const u = new URL(location.href);
      u.pathname = u.pathname.replace(/account\.html$/i, "index.html");
      if (u.pathname.endsWith("/")) u.pathname += "index.html";
      u.search = ""; u.hash = "";
      return u.toString().replace(/index\.html$/, "").replace(/\/?$/, "/");
    }
    function loadPartners() {
      try { return JSON.parse(localStorage.getItem(PARTNERS_KEY) || '{"items":[]}'); }
      catch { return { items: [] }; }
    }
    function savePartners(data) { localStorage.setItem(PARTNERS_KEY, JSON.stringify(data)); }
    function uid() { return (Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4)).toLowerCase(); }
    function partnerUrl(code) { return `${partnerSearchBase()}?p=${encodeURIComponent(code)}`; }

    function renderCandidate(u) {
      const sheet = JSON.parse(localStorage.getItem(TIMESHEET_KEY) || "{}");
      const my = sheet[u.contactId] || [];
      const surveyDone = !!(JSON.parse(localStorage.getItem(SURVEY_KEY) || "{}")[u.contactId]);
      document.getElementById("tabCandidate").innerHTML = `
        <p class="muted" style="margin-top:0">Уровень ${u.level || 0}. Поиск вакансий — на <a href="index.html" style="color:var(--heading)">витрине</a>.</p>
        <h2>Рефералка</h2>
        <p class="muted">После адаптации друга — крупная выплата; за следующие его вахты — снова.</p>
        <div class="field">
          <label class="lbl">Ваша ссылка</label>
          <div class="row">
            <input id="refLink" readonly value="${escapeHtml(referralLink(u.contactId))}" />
            <button type="button" class="btn btn-ghost" id="copyRef">Копировать</button>
          </div>
        </div>
        <h2>Самотабель</h2>
        <div class="row">
          <input id="shiftDate" type="date" style="max-width:180px" />
          <button type="button" class="btn btn-primary" id="addShift">Отметить смену</button>
        </div>
        <div id="shiftList" class="muted" style="margin-top:8px"></div>
        <h2 style="margin-top:18px">Опрос</h2>
        <p class="muted">100₽ → 1000₽ после адаптации. ${surveyDone ? "Ответы уже сохранены на устройстве." : ""}</p>
        <div class="field"><label class="lbl">Питание vs ставка</label>
          <select id="q1"><option value="">—</option><option>с питанием, ставка меньше</option><option>без питания, ставка больше</option></select>
        </div>
        <div class="field"><label class="lbl">Работодатель vs +200₽</label>
          <select id="q2"><option value="">—</option><option>проверенный работодатель</option><option>ставка выше на 200₽</option></select>
        </div>
        <div class="field"><label class="lbl">Знали про рефералку?</label>
          <select id="q3"><option value="">—</option><option>не знал(а)</option><option>уже знал(а)</option></select>
        </div>
        <div class="field"><label class="lbl">Готовы делиться опытом?</label>
          <select id="q4"><option value="">—</option><option>да</option><option>нет</option></select>
        </div>
        <button type="button" class="btn btn-primary" id="saveSurvey">Сохранить ответы</button>
        <p id="surveyStatus" class="muted"></p>`;

        const hasIssues = !!(plan.ambiguous && plan.ambiguous.length) || !!(plan.missing && plan.missing.length) || !!(plan.notes && plan.notes.length);
        updNotes.classList.toggle("has-issues", hasIssues);

          report = "Есть неоднозначные объекты — в таблицу НЕ писала. Разберите вопросы ниже.\n\n" + report;

          show("Ошибка записи");
        }

        if (!chatPack.value) return show("Сначала «Сформировать»");
        await navigator.clipboard.writeText(chatPack.value); show("Скопировано");
      };
      document.getElementById("pCreate").onclick = () => {
        const name = pName.value.trim();
        const maxUrl = pMax.value.trim();
        const bitrixId = pBitrix.value.trim();
        const comment = pComment.value.trim();
        if (!name || !maxUrl) return show("Нужны имя и MAX");
        if (!bitrixId) return show("Нужен CONTACT_ID");
        const data = loadPartners();
        const code = uid();
        data.items.push({ code, name, maxUrl, bitrixId, comment, active: true, createdAt: new Date().toISOString() });
        savePartners(data);
        pName.value = pMax.value = pBitrix.value = pComment.value = "";
        renderPartnerList();
        navigator.clipboard.writeText(partnerUrl(code)).catch(() => {});
        show("Ссылка создана и скопирована");
      };
      document.getElementById("pExport").onclick = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(loadPartners(), null, 2)], { type: "application/json" }));
        a.download = "partners-data.json"; a.click();
      };
      document.getElementById("pImport").onchange = async (e) => {
        const file = e.target.files?.[0]; if (!file) return;
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data.items)) return show("Неверный JSON");
        savePartners(data); renderPartnerList(); show("Загружено");
      };
      setAdminSub("partners");
    }

    async function render() {
      const u = load();
      const auth = document.getElementById("authPanel");
      const cab = document.getElementById("cabinet");
      if (!u || !u.contactId) {
        auth.classList.remove("hidden");
        cab.classList.add("hidden");
        document.getElementById("wrap").classList.remove("wide");
        return;
      }
      auth.classList.add("hidden");
      cab.classList.remove("hidden");

      const admin = isAdminUser(u);
      const fl = !!(u.flOk || u.role === "freelancer");
      let roleLabel = "соискатель";
      if (admin) roleLabel = "админ ЦВЗ";
      else if (fl) roleLabel = "фрилансер";
      document.getElementById("cabHello").textContent = `${u.fio || "Без имени"} · ${u.phone} · ${roleLabel} · ID ${u.contactId}`;

      const tabs = document.getElementById("cabTabs");
      tabs.innerHTML = "";
      // Админу — только админка (без пустых вкладок соискатель/фрилансер).
      // Фрилансеру — фриланс + соискатель (один человек может быть обоими).
      // Соискателю — соискатель.
      const list = [];
      if (admin) list.push(["Admin", "Админ"]);
      else {
        list.push(["Candidate", "Соискатель"]);
        if (fl) list.push(["Freelancer", "Фрилансер"]);
      }
      list.forEach(([key, label]) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "tab"; b.dataset.tab = key; b.textContent = label;
        b.onclick = () => setTab(key);
        tabs.append(b);
      });

      if (admin) {
        renderAdmin();
        setTab("Admin");
      } else {
        renderCandidate(u);
        await renderFreelancer(u);
        setTab(fl ? "Freelancer" : "Candidate");
      }
    }

    document.getElementById("authBtn").onclick = async () => {
      const phone = phoneEl.value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("authBtn");
      if (!CVZ_BX.isValidPhone(phone)) return show("Введите полный телефон: +7 (999) 999-99-99");
      if (!password || password.length < 4) return show("Пароль от 4 символов");
      btn.disabled = true;
      try {
        let meta;
        if (authMode === "login") {
          meta = await CVZ_BX.loginContact({ phone, password });
        } else {
          const fio = document.getElementById("fio").value.trim();
          if (!fio) throw new Error("Укажите ФИО");
          if (!document.getElementById("pdn").checked) throw new Error("Нужно согласие на обработку персональных данных");
          if (!document.getElementById("terms").checked) throw new Error("Нужно принять Пользовательское соглашение");
          const ref = new URLSearchParams(location.search).get("ref") || "";
          const consentAt = new Date().toISOString();
          const consentVer = (window.CVZ_BITRIX && window.CVZ_BITRIX.docsVersion) || "v1";
          meta = await CVZ_BX.registerContact({
            fio, phone, password, role: "candidate", refId: ref, consentAt, consentVer
          });
        }
        let localAdmin = false;
        const ap = document.getElementById("adminPass").value;
        if (ap && ap === (window.CVZ_PARTNERS_PASS || "")) localAdmin = true;
        saveSession({ ...meta, localAdmin });
        show(authMode === "login" ? "Вход выполнен" : "Регистрация выполнена");
        await render();
      } catch (e) {
        show(e.message || String(e));
      } finally {
        btn.disabled = false;
      }
    };

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem(KEY);
      render();
      show("Вышли");
    };

    render();
  </script>
</body>
</html>
